# Daily images for the profile README, each in a dark and a light version (v6 colours):
#   metrics/stats.{dark,light}.svg   scripts/make-stats.mjs (our own code): contributions, languages
#                                    and when Nev codes, private work included
#   metrics/snake.{dark,light}.svg   Platane/snk: the contribution graph eaten by a snake
# METRICS_TOKEN (a classic token: repo, read:user, read:org) is only given to our own script; the
# snake uses the workflow's own GITHUB_TOKEN. Third-party actions are pinned to a commit.
name: Metrics

on:
  schedule:
    - cron: '0 3 * * *' # 06:00 in Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml, scripts/make-stats.mjs]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Stats
        run: node scripts/make-stats.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: nevcanuludas
          outputs: |
            metrics/snake.dark.svg?palette=github-dark&color_snake=#6ff7e0&color_dots=#11161d,#0f3a36,#1b6b62,#3fb3a2,#6ff7e0
            metrics/snake.light.svg?color_snake=#0a8a7a&color_dots=#eef2f5,#b8ece4,#6fd9c8,#2fb8a6,#0a8a7a
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics/
          git diff --cached --quiet && exit 0
          git commit -m 'Update stats'
          git pull --rebase
          git push
