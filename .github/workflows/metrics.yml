# Daily stats for the profile README, in a dark and a light version (v6 colours):
#   metrics/stats.{dark,light}.svg   lowlighter/metrics: activity, community and repository
#                                    counts, private repos included
# GitHub's own contribution graph is on the profile already, so there is no calendar or snake.
# To be replaced by our own script (scripts/make-stats.mjs), so the token never reaches a
# third-party action.
# Needs the METRICS_TOKEN secret: a classic token with repo, read:user and read:org.
name: Metrics

on:
  schedule:
    - cron: '0 3 * * *' # 06:00 in Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # one commit at a time
      matrix:
        include:
          - theme: dark
            css: 'svg { color: #8b97a3 } h1, h2, h3 { color: #6ff7e0 } .field svg { fill: #4c5763 }'
          - theme: light
            css: 'svg { color: #4c5763 } h1, h2, h3 { color: #0a8a7a } .field svg { fill: #8b97a3 }'
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nevcanuludas
          filename: metrics/stats.${{ matrix.theme }}.svg
          template: classic
          config_display: large
          config_timezone: Europe/Istanbul
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          extras_css: ${{ matrix.css }}
          committer_message: 'Update stats (${{ matrix.theme }})'
